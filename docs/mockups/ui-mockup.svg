<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EEF3FF"/>
      <stop offset="1" stop-color="#DFF8EF"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4D73FF"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25"/>
    </filter>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <circle cx="250" cy="180" r="220" fill="#4D73FF" opacity="0.16" filter="url(#blur)"/>
  <circle cx="1320" cy="130" r="170" fill="#10B981" opacity="0.14" filter="url(#blur)"/>

  <!-- Top nav -->
  <rect x="26" y="18" width="1548" height="92" rx="24" fill="white" fill-opacity="0.62" stroke="white"/>
  <rect x="52" y="43" width="42" height="42" rx="12" fill="url(#brand)"/>
  <text x="110" y="61" font-family="Inter, Arial" font-size="14" fill="#5E6A8A" letter-spacing="2">DIRECTORY STUDIO</text>
  <text x="110" y="84" font-family="Inter, Arial" font-size="28" font-weight="700" fill="#131A2C">LDAP UI</text>

  <rect x="1160" y="42" width="280" height="44" rx="14" fill="white" stroke="#C7D2FE"/>
  <text x="1188" y="70" font-family="Inter, Arial" font-size="16" fill="#64748B">🔎 Search directory…</text>

  <!-- Content split -->
  <rect x="26" y="130" width="390" height="824" rx="26" fill="white" fill-opacity="0.64" stroke="white"/>
  <rect x="434" y="130" width="1140" height="824" rx="26" fill="white" fill-opacity="0.64" stroke="white"/>

  <!-- Sidebar tree -->
  <text x="56" y="176" font-family="Inter, Arial" font-size="16" font-weight="700" fill="#1E293B">Navigation</text>
  <g font-family="Inter, Arial" font-size="14" fill="#334155">
    <rect x="52" y="190" width="338" height="34" rx="10" fill="#EEF2FF"/>
    <text x="64" y="212">dc=example,dc=com</text>

    <text x="72" y="252">▾ ou=People</text>
    <rect x="88" y="264" width="290" height="30" rx="8" fill="#E0E7FF"/>
    <text x="100" y="284" font-weight="700">cn=Fred Flintstone</text>
    <text x="88" y="316">cn=Wilma Flintstone</text>
    <text x="88" y="344">cn=Barney Rubble</text>

    <text x="72" y="388">▸ ou=Groups</text>
    <text x="72" y="416">▸ ou=Devices</text>
  </g>

  <!-- Right editor header -->
  <rect x="460" y="156" width="1088" height="64" rx="16" fill="#4D73FF" fill-opacity="0.12"/>
  <text x="486" y="196" font-family="Inter, Arial" font-size="20" font-weight="700" fill="#1F2A44">cn=Fred Flintstone,ou=People,dc=example,dc=com</text>

  <!-- Form rows -->
  <g font-family="Inter, Arial" font-size="14">
    <text x="486" y="264" fill="#334155">cn</text>
    <rect x="640" y="238" width="876" height="40" rx="10" fill="white" stroke="#D6DFF8"/>
    <text x="658" y="263" fill="#0F172A">Fred Flintstone</text>

    <text x="486" y="324" fill="#334155">sn</text>
    <rect x="640" y="298" width="876" height="40" rx="10" fill="white" stroke="#D6DFF8"/>
    <text x="658" y="323" fill="#0F172A">Flintstone</text>

    <text x="486" y="384" fill="#334155">mail</text>
    <rect x="640" y="358" width="876" height="40" rx="10" fill="white" stroke="#D6DFF8"/>
    <text x="658" y="383" fill="#0F172A">fred.flintstone@example.com</text>

    <text x="486" y="444" fill="#334155">telephoneNumber</text>
    <rect x="640" y="418" width="876" height="40" rx="10" fill="white" stroke="#D6DFF8"/>
    <text x="658" y="443" fill="#0F172A">+49 123 456789</text>
  </g>

  <!-- CTA row -->
  <rect x="640" y="506" width="136" height="44" rx="12" fill="#4D73FF"/>
  <text x="687" y="534" font-family="Inter, Arial" font-size="16" font-weight="700" fill="white">Submit</text>

  <rect x="788" y="506" width="120" height="44" rx="12" fill="#94A3B8"/>
  <text x="832" y="534" font-family="Inter, Arial" font-size="16" font-weight="700" fill="white">Reset</text>

  <rect x="1310" y="506" width="206" height="44" rx="12" fill="#10B981" fill-opacity="0.18"/>
  <text x="1340" y="534" font-family="Inter, Arial" font-size="15" font-weight="700" fill="#047857">+ Add attribute</text>

  <text x="26" y="972" font-family="Inter, Arial" font-size="13" fill="#64748B">Mockup preview · LDAP UI modern style</text>
</svg>
